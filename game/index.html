<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Shot</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06070b; }
  #arena { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; image-rendering: auto; cursor: crosshair; }
  #spoken { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="arena" aria-label="Last Shot: every bullet you fire is paid for in your own blood, and every kill pays it back"></canvas>
<p id="spoken" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
